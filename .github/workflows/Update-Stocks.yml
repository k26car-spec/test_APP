name: Daily Stock Price Update

on:
  schedule:
    - cron: '0 1 * * 1-5'  # 台灣時間 09:00 (UTC 01:00) 週一至週五
  workflow_dispatch:  # 手動也可以觸發

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: pip install yfinance pandas
        
      - name: Fetch real stock prices & KD
        run: |
          python - << 'PY'
          import yfinance as yf
          import json
          import datetime
          
          codes = ['2330.TW','2317.TW','2454.TW','2603.TW','2881.TW','2412.TW','1301.TW','2002.TW','3711.TW','2609.TW','3481.TW','1303.TW']
          vol_map = {'2330':5840,'2317':4920,'2454':3210,'2603':4120,'2881':3850,'2412':2980,'1301':2650,'2002':3120,'3711':2250,'2609':1980,'3481':4200,'1303':1850}
          amt_map = {'2330':18.2,'2317':12.5,'2454':10.8,'2603':8.2,'2881':7.5,'2412':6.1,'1301':5.4,'2002':4.8,'3711':4.2,'2609':3.9,'3481':3.5,'1303':3.1}
          name_map = {'2330':'台積電','2317':'鴻海','2454':'聯發科','2603':'長榮','2881':'富邦金','2412':'中華電','1301':'台塑','2002':'中鋼','3711':'日月光投控','2609':'陽明','3481':'群創','1303':'南亞'}
          
          stocks = []
          for c in codes:
              code = c.split('.')[0]
              try:
                  ticker = yf.Ticker(c)
                  hist = ticker.history(period='3mo')
                  if len(hist) < 20:
                      continue
                  closes = hist['Close'].tolist()
                  highs = hist['High'].tolist()
                  lows = hist['Low'].tolist()
                  # calc KD
                  K=50
                  D=50
                  for i in range(8, len(closes)):
                      low_n = min(lows[i-8:i+1])
                      high_n = max(highs[i-8:i+1])
                      rsv = 50 if high_n==low_n else (closes[i]-low_n)/(high_n-low_n)*100
                      K = K*2/3 + rsv*1/3
                      D = D*2/3 + K*1/3
                  price = float(closes[-1])
                  stocks.append({
                    "code": code,
                    "name": name_map.get(code, code),
                    "vol": vol_map.get(code, 0),
                    "price": round(price,2),
                    "amtPct": amt_map.get(code,0),
                    "K": int(round(K)),
                    "D": int(round(D))
                  })
              except Exception as e:
                  print(f"fail {c}: {e}")
          
          # USD/TWD
          try:
              twd = yf.Ticker('TWD=X').history(period='5d')
              usd_twd = float(twd['Close'].iloc[-1])
              usd_change = float(twd['Close'].iloc[-1] - twd['Close'].iloc[-2])
          except:
              usd_twd = 32.5
              usd_change = 0
          
          data = {
            "updated": datetime.datetime.now().isoformat(),
            "source": "yfinance",
            "usd_twd": usd_twd,
            "usd_twd_change": usd_change,
            "stocks": stocks
          }
          with open('data.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          print("data.json updated")
          PY
          
      - name: Commit and push
        run: |
          git config user.name "Stock Bot"
          git config user.email "bot@github.com"
          git add data.json
          git commit -m "auto: update stock prices $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push
