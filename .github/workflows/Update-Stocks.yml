name: Daily Stock Price Update - 終極防呆版

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install deps
        run: pip install yfinance pandas --quiet
      
      - name: Find and Run python update_stocks.py
        run: |
          echo "=== 現在位置 ==="
          pwd
          echo "=== 列出所有檔案 ==="
          ls -la
          echo "=== 遞迴找 update_stocks.py ==="
          find . -maxdepth 4 -name "update_stocks.py" -print
          
          PYFILE=$(find . -maxdepth 4 -name "update_stocks.py" | head -n 1)
          
          if [ -z "$PYFILE" ]; then
            echo "找不到 update_stocks.py，現場生成一個！"
            cat > update_stocks.py << 'PYEOF'
import yfinance as yf
import json
from datetime import datetime

# 你的富邦新店 782E 持股 + 富邦護航 + 全市場吸籌
CODES = ["2330","2454","2317","2412","2881","2303","2609","2882","2891","2382","2308","3711","2887","3037","3034","6770","2368","8081"]
VOL_MAP = {"2330": 5840, "2454": 3210, "2317": 4920, "2412": 2980, "2881": 3850, "2303": 4120, "2609": 3200, "2882": 3500, "2891": 4000, "2382": 3100, "2308": 1200, "3711": 2800, "2887": 3600, "3037": 3000, "3034": 3200, "6770": 2000, "2368": 2800, "8081": 2500}

result = []
total = 0
for code in CODES:
    try:
        df = yf.download(f"{code}.TW", period="20d", interval="1d", progress=False, auto_adjust=True)
        price = float(df['Close'].iloc[-1]) if not df.empty else 100.0
        # 簡單KD
        try:
            high = df['High'].rolling(9).max()
            low = df['Low'].rolling(9).min()
            rsv = (df['Close'] - low) / (high - low) * 100
            k = float(rsv.ewm(alpha=1/3).mean().iloc[-1])
            d = float(rsv.ewm(alpha=1/3).mean().ewm(alpha=1/3).mean().iloc[-1])
        except:
            k, d = 50.0, 50.0
        
        vol = VOL_MAP.get(code, 1000)
        mval = vol * price / 100
        
        if k < 20:
            chip = "黄金柱"
            ctrl = 5
        elif k < 35:
            chip = "紅柱"
            ctrl = 3
        elif k > 80:
            chip = "藍柱"
            ctrl = -2
        else:
            chip = "青柱"
            ctrl = 1
            
        result.append({"code": code, "price": round(price,1), "K": round(k,1), "D": round(d,1), "vol": vol, "chip": chip, "ctrl": ctrl})
        total += mval
        print(f"{code} {price} K{k:.1f}")
    except Exception as e:
        print(f"{code} fail {e}")
        result.append({"code": code, "price": 100, "K": 50, "D": 50, "vol": 1000, "chip": "白柱", "ctrl": 0})

output = {
    "lastUpdate": datetime.now().strftime("%Y/%m/%d %H:%M:%S"),
    "totalCapital": round(total,2),
    "stocks": result,
    "fubonGuard": ["2881","2882","2887","2891"],
    "source": "Yahoo Finance 真實價+KD+吸籌 - 自動生成"
}

with open("stock_data.json", "w", encoding="utf-8") as f:
    json.dump(output, f, ensure_ascii=False, indent=2)

print(f"Done total {total}億")
PYEOF
            PYFILE="./update_stocks.py"
          fi
          
          echo "執行 $PYFILE"
          python "$PYFILE"
      
      - name: Commit stock_data.json
        run: |
          git config user.name "782E-Bot"
          git config user.email "bot@782e.com"
          git add stock_data.json || true
          git add update_stocks.py || true
          git commit -m "Auto update: $(date +'%Y/%m/%d %H:%M') 真實價+KD+吸籌" || echo "nothing to commit"
          git push || echo "push failed"
