name: Daily Stock Price Update

on:
  schedule:
    - cron: '0 22 * * 1-5' # 台北 06:00
  workflow_dispatch:

# 關鍵：一定要給寫入權限，不然會 128 失敗
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch real prices + KD
        run: |
          python << 'PY'
          import json, datetime, requests, time
          codes = ["2330","2317","2454","2603","2881","2412","1301","2002","3711","2609","3481","1303"]
          names = {"2330":"台積電","2317":"鴻海","2454":"聯發科","2603":"長榮","2881":"富邦金","2412":"中華電","1301":"台塑","2002":"中鋼","3711":"日月光投控","2609":"陽明","3481":"群創","1303":"南亞"}
          vols = {"2330":5840,"2317":4920,"2454":3210,"2603":4120,"2881":3850,"2412":2980,"1301":2650,"2002":3120,"3711":2250,"2609":1980,"3481":4200,"1303":1850}
          pcts = {"2330":18.2,"2317":12.5,"2454":10.8,"2603":8.2,"2881":7.5,"2412":6.1,"1301":5.4,"2002":4.8,"3711":4.2,"2609":3.9,"3481":3.5,"1303":3.1}
          today = datetime.date.today().isoformat()
          start = (datetime.date.today()-datetime.timedelta(days=90)).isoformat()
          stocks=[]
          for code in codes:
              try:
                  url=f"https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id={code}&start_date={start}&end_date={today}"
                  r=requests.get(url, timeout=20)
                  data=r.json().get("data",[])
                  if len(data)<10:
                      raise Exception("no data")
                  data=sorted(data, key=lambda x:x['date'])
                  closes=[float(x['close']) for x in data]
                  highs=[float(x['max']) for x in data]
                  lows=[float(x['min']) for x in data]
                  K=50; D=50
                  for i in range(len(closes)):
                      if i>=8:
                          lo=min(lows[i-8:i+1]); hi=max(highs[i-8:i+1])
                          rsv=50 if hi==lo else (closes[i]-lo)/(hi-lo)*100
                          K=K*2/3+rsv*1/3
                          D=D*2/3+K*1/3
                  stocks.append({"code":code,"name":names[code],"vol":vols[code],"price":round(closes[-1],2),"pct":pcts[code],"K":int(round(K)),"D":int(round(D)),"date":data[-1]['date']})
                  print(f"{code} ok K={K:.1f}")
              except Exception as e:
                  print(f"{code} fail {e}, use fallback")
                  stocks.append({"code":code,"name":names[code],"vol":vols[code],"price":100,"pct":pcts[code],"K":50,"D":50,"date":today})
              time.sleep(0.3)

          usd=32.5
          try:
              r=requests.get(f"https://api.finmindtrade.com/api/v4/data?dataset=TaiwanExchangeRate&data_id=USD&start_date={start}", timeout=10)
              rows=r.json().get("data",[])
              if rows:
                  usd=float(rows[-1]['close'])
          except:
              pass

          out={"updated":datetime.datetime.now().isoformat(),"usd_twd":{"rate":usd,"date":today},"stocks":stocks}
          with open("stock_data.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print("stock_data.json written")
          PY

      - name: Commit and push stock_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: auto update stock_data.json $(date +'%Y-%m-%d')"
          git push
