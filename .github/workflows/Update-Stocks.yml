name: Daily Stock Price Update - 真實價+KD+吸籌+富邦護航

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install yfinance pandas --quiet
      - name: Run update_stocks.py (auto-find)
        run: |
          echo "PWD"
          pwd
          ls -la
          find . -maxdepth 4 -name "update_stocks.py"
          PYFILE=$(find . -maxdepth 4 -name "update_stocks.py" | head -n 1)
          if [ -z "$PYFILE" ]; then
            echo "未找到，現場生成"
            PYFILE="./update_stocks.py"
          fi
          echo "執行 $PYFILE"
          python "$PYFILE"
          ls -lh stock_data.json
      - name: Commit
        run: |
          git config user.name "782E-Bot"
          git config user.email "bot@782e.com"
          git add stock_data.json update_stocks.py || true
          git commit -m "Auto update $(date +'%Y/%m/%d %H:%M') 真實價+KD+吸籌+富邦護航" || echo "nothing"
          git push || echo "push failed"
