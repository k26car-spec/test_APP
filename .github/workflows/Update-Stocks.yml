name: Daily Stock Price Update - 真實吸籌+KD版

on:
  schedule:
    - cron: '30 0 * * 1-5'  # 台北 08:30
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas
      - run: python update_stocks.py
      - name: Commit
        run: |
          git config user.name "782E-Bot"
          git config user.email "bot@782e.com"
          git add stock_data.json
          git commit -m "Auto update: $(date +'%Y/%m/%d %H:%M') 真實價+K/D+吸籌" || exit 0
          git push
