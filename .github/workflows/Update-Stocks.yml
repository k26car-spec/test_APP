name: Daily Stock Price Update - 真實價+KD+吸籌+富邦護航

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install yfinance pandas --quiet

      - name: Run real price update (no file needed)
        run: |
          python << 'PY'
          import yfinance as yf, json, os
          from datetime import datetime
          CODES = ["2330","2454","2317","2412","2881","2303","2609","2882","2891","2382","2308","3711","2887","3037","3034","6770","2368","8081"]
          VOL = {"2330":5840,"2454":3210,"2317":4920,"2412":2980,"2881":3850,"2303":4120,"2609":3200,"2882":3500,"2891":4000,"2382":3100,"2308":1200,"3711":2800,"2887":3600,"3037":3000,"3034":3200,"6770":2000,"2368":2800,"8081":2500}
          result=[]
          total=0
          for code in CODES:
              try:
                  df = yf.download(f"{code}.TW", period="30d", interval="1d", progress=False, auto_adjust=True)
                  if df.empty or len(df) < 5:
                      price=100.0
                      k=50.0
                      d=50.0
                  else:
                      price=float(df['Close'].iloc[-1])
                      high=df['High'].rolling(9).max()
                      low=df['Low'].rolling(9).min()
                      rsv=(df['Close']-low)/(high-low)*100
                      k=float(rsv.ewm(com=2).mean().iloc[-1])
                      d=float(rsv.ewm(com=2).mean().ewm(com=2).mean().iloc[-1])
                  vol=VOL.get(code,1000)
                  mval=vol*price/100
                  total+=mval
                  if k<20:
                      chip="黄金柱"; ctrl=5; trend="強吸+放量"
                  elif k<35:
                      chip="紅柱"; ctrl=3; trend="吸籌積極"
                  elif k>80:
                      chip="藍柱"; ctrl=-2; trend="高位出貨"
                  elif k>70:
                      chip="白柱"; ctrl=0; trend="洗盤"
                  else:
                      chip="青柱"; ctrl=1; trend="吸籌中"
                  result.append({"code":code,"price":round(price,2),"K":round(k,1),"D":round(d,1),"vol":vol,"chip":chip,"ctrl":ctrl,"trend":trend,"marketVal":round(mval,2)})
                  print(f"{code} {price} K{k:.1f} {chip}")
              except Exception as e:
                  print(f"{code} error {e}")
                  result.append({"code":code,"price":100,"K":50,"D":50,"vol":1000,"chip":"白柱","ctrl":0,"trend":"洗盤","marketVal":1.0})
          output={"lastUpdate":datetime.now().strftime("%Y/%m/%d %H:%M:%S"),"totalCapital":round(total,2),"stocks":result,"fubonGuard":["2881","2882","2887","2891"],"source":"Yahoo Finance 真實價+KD+吸籌+富邦新店護航"}
          with open("stock_data.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print(f"DONE total {total:.2f}億")
          PY

      - name: Commit
        run: |
          git config user.name "782E-Bot"
          git config user.email "bot@782e.com"
          git add stock_data.json || true
          git commit -m "Auto update $(date +'%Y/%m/%d %H:%M') 真實價+KD+吸籌+富邦護航" || echo "nothing"
          git push || echo "push failed"
