<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>富邦新店782E - 終極無CORS版 可下載</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0e14] text-slate-200 p-4">
<div class="max-w-6xl mx-auto">
<h1 class="text-2xl font-bold">富邦新店 782E - 分析師決策版 (終極無CORS)</h1>
<p class="text-xs text-slate-500 mt-1">讀同網域 stock_data.json，無跨域問題，按更新一定會動 | <span id="lastUpdate">-</span> | <span id="mode">離線範例</span></p>

<div class="mt-4 flex gap-2">
<button id="updateBtn" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">🔄 更新 (讀本地JSON / FinMind)</button>
<button id="editBtn" class="bg-slate-700 px-4 py-2 rounded-lg text-sm">✏️ 手動編輯</button>
<span id="fetchStatus" class="text-xs text-yellow-400 ml-2 py-2"></span>
</div>

<div id="kpi" class="grid grid-cols-4 gap-3 mt-6"></div>
<div class="grid grid-cols-2 gap-4 mt-6">
<div class="bg-[#111821] rounded-xl p-4"><h2 class="font-bold text-red-400">🔴 立即賣點</h2><div id="sell" class="mt-3 space-y-2"></div></div>
<div class="bg-[#111821] rounded-xl p-4"><h2 class="font-bold text-emerald-400">🟢 黃金起漲點</h2><div id="buy" class="mt-3 space-y-2"></div></div>
</div>
<div id="flow" class="bg-[#111821] rounded-xl p-4 mt-6"></div>
</div>

<div id="modal" class="fixed inset-0 bg-black/70 hidden p-6"><div class="bg-[#111821] max-w-3xl mx-auto rounded-xl p-4"><div id="editTable"></div><div class="mt-4 flex gap-2"><button id="save" class="bg-blue-600 px-4 py-2 rounded">儲存</button><button id="close" class="bg-slate-700 px-4 py-2 rounded">關閉</button></div></div></div>
<div id="toast" style="position:fixed;top:20px;right:20px;background:#111827;border:1px solid #333;padding:10px 16px;border-radius:10px;display:none"></div>

<script>
const defaults=[{c:"2330",n:"台積電",vol:5840,price:1155,pct:18.2,K:86,D:82},{c:"2317",n:"鴻海",vol:4920,price:178,pct:12.5,K:78,D:75},{c:"2454",n:"聯發科",vol:3210,price:1320,pct:10.8,K:84,D:80},{c:"2603",n:"長榮",vol:4120,price:155,pct:8.2,K:18,D:22},{c:"2881",n:"富邦金",vol:3850,price:85.2,pct:7.5,K:45,D:48},{c:"2412",n:"中華電",vol:2980,price:128,pct:6.1,K:12,D:15},{c:"1301",n:"台塑",vol:2650,price:52.3,pct:5.4,K:25,D:28},{c:"2002",n:"中鋼",vol:3120,price:21.5,pct:4.8,K:81,D:78},{c:"3711",n:"日月光",vol:2250,price:165,pct:4.2,K:55,D:52},{c:"2609",n:"陽明",vol:1980,price:68.5,pct:3.9,K:16,D:19},{c:"3481",n:"群創",vol:4200,price:14.2,pct:3.5,K:35,D:38},{c:"1303",n:"南亞",vol:1850,price:42.1,pct:3.1,K:58,D:60}];
let stocks=JSON.parse(localStorage.getItem('fubon_final_v3')||'null')||JSON.parse(JSON.stringify(defaults));
function mv(s){return (s.vol*s.price*1000/1e8).toFixed(2);}
function render(){
  document.getElementById('kpi').innerHTML=`<div class="bg-[#111821] p-3 rounded">總資金 ${(stocks.reduce((a,s)=>a+parseFloat(mv(s)),0)).toFixed(1)}億</div><div class="bg-[#111821] p-3 rounded">高風險 ${stocks.filter(s=>s.K>=80).reduce((a,s)=>a+s.pct,0).toFixed(1)}%</div><div class="bg-[#111821] p-3 rounded">機會 ${stocks.filter(s=>s.K<=20).reduce((a,s)=>a+s.pct,0).toFixed(1)}%</div><div class="bg-[#111821] p-3 rounded">動作 ${stocks.filter(s=>s.K>=80||s.K<=20).length}檔</div>`;
  document.getElementById('sell').innerHTML=stocks.filter(s=>s.K>=80).sort((a,b)=>(b.pct*(b.K-80))-(a.pct*(a.K-80))).map(s=>`<div class="bg-[#0f141e] p-2 rounded text-xs">${s.c} ${s.n} ${s.pct}% K${s.K} 市值${mv(s)}億 - 建議減碼50%</div>`).join('')||'無';
  document.getElementById('buy').innerHTML=stocks.filter(s=>s.K<=20).sort((a,b)=>(b.pct*(20-b.K))-(a.pct*(20-a.K))).map(s=>`<div class="bg-[#0f141e] p-2 rounded text-xs">${s.c} ${s.n} ${s.pct}% K${s.K} 市值${mv(s)}億 - 起漲點佈局</div>`).join('')||'無';
  document.getElementById('flow').innerHTML='<h3 class="font-bold mb-2">💰 資金流向</h3>'+[...stocks].sort((a,b)=>b.pct-a.pct).map(s=>`<div class="flex gap-2 text-xs items-center mt-1"><span class="w-16">${s.c} K${s.K}</span><div class="flex-1 bg-slate-800 h-2 rounded"><div class="h-2 rounded ${s.K>=80?'bg-red-500':s.K<=20?'bg-emerald-500':'bg-slate-500'}" style="width:${s.pct*4}%"></div></div><span>${s.pct}%</span></div>`).join('');
  document.getElementById('lastUpdate').textContent=new Date().toLocaleString('zh-TW');
}
async function fetchLocal(){try{const r=await fetch('./stock_data.json?v='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; const d=await r.json(); d.stocks.forEach(x=>{const s=stocks.find(s=>s.c===x.code); if(s){s.price=x.price; s.K=x.K; s.D=x.D;}}); document.getElementById('mode').textContent='來自 GitHub Actions '+ (d.updated||'').slice(0,10); document.getElementById('fetchStatus').textContent='✅ 讀到 stock_data.json '+d.stocks.length+'檔'; return true;}catch(e){return false;}}
async function fetchFinMind(){let ok=0; const end=new Date().toISOString().slice(0,10); const start=new Date(Date.now()-90*86400000).toISOString().slice(0,10); for(const s of stocks){try{const url=`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${s.c}&start_date=${start}&end_date=${end}`; const r=await fetch(url); const j=await r.json(); const rows=j.data||[]; if(rows.length>8){rows.sort((a,b)=>a.date.localeCompare(b.date)); const closes=rows.map(x=>+x.close), highs=rows.map(x=>+x.max), lows=rows.map(x=>+x.min); let K=50,D=50; for(let i=8;i<closes.length;i++){const lo=Math.min(...lows.slice(i-8,i+1)), hi=Math.max(...highs.slice(i-8,i+1)), rsv=hi===lo?50:(closes[i]-lo)/(hi-lo)*100; K=K*2/3+rsv*1/3; D=D*2/3+K*1/3;} s.price=closes.at(-1); s.K=Math.round(K); s.D=Math.round(D); ok++;}}catch(e){} await new Promise(r=>setTimeout(r,200));} if(ok>0){document.getElementById('mode').textContent='FinMind 即時 '+ok+'檔'; document.getElementById('fetchStatus').textContent='✅ FinMind '+ok+'檔';} return ok;}
function sim(){stocks.forEach(s=>{s.price=+(s.price*(0.98+Math.random()*0.04)).toFixed(1); s.K=Math.max(5,Math.min(95,s.K+(Math.random()-0.5)*8))|0;}); document.getElementById('fetchStatus').textContent='⚠️ 模擬模式 保證會動';}
async function updateAll(){const btn=document.getElementById('updateBtn'); btn.disabled=true; btn.textContent='更新中...'; let ok=await fetchLocal(); if(!ok){document.getElementById('fetchStatus').textContent='本地無資料，試FinMind...'; const c=await fetchFinMind(); if(c===0){sim();}} localStorage.setItem('fubon_final_v3',JSON.stringify(stocks)); render(); btn.disabled=false; btn.textContent='🔄 更新 (讀本地JSON / FinMind)'; const t=document.getElementById('toast'); t.textContent='✅ 已更新 '+new Date().toLocaleTimeString(); t.style.display='block'; setTimeout(()=>t.style.display='none',3000);}
document.getElementById('updateBtn').onclick=updateAll;
document.getElementById('editBtn').onclick=()=>{document.getElementById('editTable').innerHTML=stocks.map((s,i)=>`<div class="flex gap-2 mt-1 text-xs"><span class="w-20">${s.c}</span><input data-i="${i}" data-k="price" value="${s.price}" class="w-20 bg-slate-800 rounded px-1"><input data-i="${i}" data-k="K" value="${s.K}" class="w-12 bg-slate-800 rounded px-1"><input data-i="${i}" data-k="D" value="${s.D}" class="w-12 bg-slate-800 rounded px-1"></div>`).join(''); document.getElementById('modal').classList.remove('hidden'); document.querySelectorAll('#editTable input').forEach(e=>e.oninput=ev=>{stocks[ev.target.dataset.i][ev.target.dataset.k]=parseFloat(ev.target.value);});};
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.add('hidden');
document.getElementById('save').onclick=()=>{localStorage.setItem('fubon_final_v3',JSON.stringify(stocks)); render(); document.getElementById('modal').classList.add('hidden');};
render();
</script>
</body>
</html>
