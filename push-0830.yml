on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Push to Telegram
        env:
          BOT_TOKEN: "8857921104:AAFcZoUET_2dOMp6CvotAkrl6c7icO7zn9Y"
          FINMIND_TOKEN: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiazI2Y2FyQGdtYWlsLmNvbSIsImVtYWlsIjoiazI2Y2FyQGdtYWlsLmNvbSIsInRva2VuX3ZlcnNpb24iOjB9.sgTD3UjMOC_fjPjwE2RS5971JIAkjC3RztSQTJBrAys"
        run: |
          echo "=== 抓 CHAT_ID ==="
          UPDATES=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates")
          echo "$UPDATES"
          CHAT_ID=$(echo "$UPDATES" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['result'][-1]['message']['chat']['id'] if data.get('result') else '')")
          echo "CHAT_ID=$CHAT_ID"
          
          if [ -z "$CHAT_ID" ]; then
            echo "找不到CHAT_ID，請先去 t.me/My_fubon782_bot 發個hi"
            exit 1
          fi

          echo "=== 推播 ==="
          MSG="📈 富邦782E 6.2 真實FinMind
          時間: $(date '+%Y-%m-%d %H:%M')
          FinMind k26car@gmail.com 已綁定
          
          🔴立即賣點 K≥80 amt%*(K-80)
          🟢黃金起漲點 K≤20 amt%*(20-K)
          白話操作 抱/賣/撿

          完整版: https://k26car-spec.github.io/test_APP/
          (此為雙Token自動推播測試)"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -d chat_id="$CHAT_ID" --data-urlencode text="$MSG"
          echo "完成"
